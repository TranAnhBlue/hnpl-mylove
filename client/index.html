<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#E91E63" />
    <meta name="description" content="Lưu giữ những kỷ niệm đẹp của chúng mình" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kỷ Niệm" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style>
      /* Prevent overscroll bounce */
      html, body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      
      /* Critical CSS for mobile - Force override */
      @media (max-width: 480px) {
        .memory-card {
          min-height: 65px !important;
          max-height: 65px !important;
          padding: 8px 10px 8px 48px !important;
          gap: 10px !important;
          border-radius: 12px !important;
        }
        
        .memory-image {
          width: 48px !important;
          height: 48px !important;
          border-radius: 8px !important;
        }
        
        .memory-content h3 {
          font-size: 14px !important;
          margin-bottom: 4px !important;
        }
        
        .memory-date {
          font-size: 11px !important;
          padding: 2px 7px !important;
        }
        
        .memories-list {
          gap: 10px !important;
        }
      }
    </style>
    <title>Kỷ Niệm Của Chúng Mình</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
